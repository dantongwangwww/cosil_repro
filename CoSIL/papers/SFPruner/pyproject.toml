[project]
name = "specprune-artifact"
version = "1.0.0"
description = "SpecPrune function pruning for CoSIL: reproducible training, routing and evaluation"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["specprune"]

